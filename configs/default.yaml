# SpikeGCPN default configuration. Paths are relative to the project root.

algo: gflownet          # gflownet | grpo | random  (overridable with --algo)
seed: 0
threads: 1              # torch threads; 1 is fastest for these small per-step graphs
run_name: null          # default: <algo>[_nosur]_s<seed>_<timestamp>

env:
  patch_size: 4         # pool 4×4 pixels per source → 2 * 9 * 9 = 162 sources (1 = raw 2312 pixels)
  num_sink: 10          # one per digit class
  max_hidden: 30        # cap on hidden neurons
  max_edges: 300        # synapse budget = max actions; the stop is forced when reached
  min_edges: 20         # stop is masked before this (guards against collapse to tiny graphs)
  rf_radii: [0, 1, 2]   # NEW-neuron receptive fields: 1×1, 3×3 or 5×5 patch cells
  # Initial synapse magnitude(s), each offered as +w and -w. With inner training a
  # single level means the policy picks only the sign (Dale's law) and gradients
  # set the magnitude. Use e.g. [0.25, 0.5, 1.0, 2.0] with inner.enabled: false.
  weight_levels: [1.0]
  # Hidden-neuron presets chosen by the policy at creation (the initial values when
  # inner training also learns thresholds/leaks). SuperNeuroMAT leak is a linear
  # decay toward reset per step: 0 = perfect integrator, .inf = memoryless.
  hidden_presets:
    - {threshold: 0.5, leak: .inf}   # coincidence detector
    - {threshold: 1.0, leak: 0.0}    # integrator
    - {threshold: 1.0, leak: 0.25}
    - {threshold: 2.0, leak: 0.5}
    - {threshold: 3.0, leak: 0.1}    # slow integrator
  source_threshold: 0.5  # inputs are 1.0 spikes, so sources relay every event
  source_leak: .inf
  sink_threshold: 1.0    # sinks integrate (leak 0) so spike count ~ net synaptic drive
  sink_leak: 0.0

model:
  embed_dim: 64
  num_layers: 3
  mlp_hidden: 128

train:
  group_size: 16         # topologies sampled per update (GRPO group / GFlowNet batch)
  max_iters: 100
  sim_budget: 400        # stop after this many topology evaluations
  log_interval: 5
  checkpoint_interval: 50
  out_dir: experiments

grpo:
  lr: 3.0e-4
  clip_eps: 0.2
  epochs: 2
  minibatch_trajs: 4
  entropy_coeff: 0.01
  max_grad_norm: 1.0

gflownet:
  lr: 3.0e-4
  logz_lr: 0.1
  max_grad_norm: 10.0
  temperature: 1.0       # sampling temperature (off-policy is fine for TB)
  explore_eps: 0.05      # uniform mixing over legal choices at sample time
  replay_size: 256
  replay_batch: 8

rewards:
  efficiency_coeff: 0.0      # penalty per (hidden neuron + edge); max_edges already bounds size
  beta: 100.0                # GFlowNet: log R = beta * reward (1 accuracy point = factor e)

inner:                   # surrogate-gradient training of each sampled topology
  enabled: true
  steps: 100             # Adam steps (minibatch BPTT)
  batch_size: 64
  lr: 0.1
  train_neuron_params: true   # also learn thresholds and leaks of sinks + hidden neurons
  slope: 5.0             # fast-sigmoid surrogate slope
  weight_jitter: 0.1     # relative init noise on synapse magnitudes
  leak_cap: 1000.0       # presets with leak = inf start (and stay ~memoryless) here
  seed: 0                # part of the reward definition: keep fixed across runs
  train_per_class: 100   # training subset (Train split)
  max_graphs_per_batch: 16

surrogate:
  enabled: true
  ensemble_size: 4
  embed_dim: 32
  num_layers: 2
  lr: 1.0e-3
  warmup: 64             # simulate everything until this many graphs are scored
  sim_per_batch: 4       # afterwards, simulate only the top-UCB graphs per batch
  ucb_kappa: 1.0
  refit_every: 16        # new simulated points between surrogate refits
  refit_steps: 50

simulator:
  nmnist_root: data/NMNIST
  num_bins: 50
  data_seed: 0           # fixes the train / val / test subsets (same reward for every run)
  reward_split: Train    # inner training and validation subsets come from Train ...
  val_per_class: 50      # reward = accuracy on these (disjoint from inner training data)
  test_split: Test       # ... and Test is only used to report the best graph
  test_per_class: 50
