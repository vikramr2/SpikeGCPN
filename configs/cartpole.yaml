# Spiking reservoir as a controller: CartPole with the velocities hidden.
#
#   (x, θ) ──population code──► sources ──► searched reservoir (state persists across
#   env steps) ──► output neurons' spike counts ──► linear readout ──► push left / right
#
# The readout sees only the output neurons. A policy on the current (x, θ) alone
# cannot balance the pole (~42 / 500 for a memoryless readout on the code), while
# one extra step of memory is enough (~500), so the reservoir is scored on whether
# it supplies that memory. The readout is behaviour-cloned from a full-state expert;
# the reward is the closed-loop return / 500 over fixed-seed episodes.
#
# Ablations as in configs/latent.yaml: env.allow_cycles=false (dag),
# env.hidden_to_hidden=false (ff: input neurons → outputs, no memory beyond the
# neurons' own leak / integration).
algo: grpo             # grpo | random
seed: 0
threads: 1
run_name: null

env:
  input_layout: line1d
  line_groups: 2         # sources: 21 population-code bins for x, then 21 for θ
  num_source: 42
  num_sink: 10           # output neurons: the only neurons the readout sees
  max_hidden: 50
  max_edges: 300
  min_edges: 0           # synapse budget is a cap; stopping early is allowed
  allow_cycles: true     # recurrent reservoir
  rf_radii: [-1, 0, 1, 3]   # -1 = latent neuron; else 1, 3 or 7 adjacent bins of x, θ or both
  weight_levels: [0.25, 0.5, 1.0, 2.0]   # fixed magnitudes the policy picks from (± each)
  hidden_presets:
    - {threshold: 0.5, leak: .inf}   # coincidence detector
    - {threshold: 1.0, leak: 0.0}    # integrator
    - {threshold: 1.0, leak: 0.25}
    - {threshold: 2.0, leak: 0.5}
    - {threshold: 3.0, leak: 0.1}    # slow integrator
  source_threshold: 0.5
  source_leak: .inf
  sink_threshold: 1.0
  sink_leak: 0.0

model:
  embed_dim: 64
  num_layers: 3
  mlp_hidden: 128

train:
  group_size: 16
  max_iters: 200
  sim_budget: 3200       # topology evaluations
  log_interval: 5
  checkpoint_interval: 50
  out_dir: experiments

grpo:
  lr: 3.0e-4
  clip_eps: 0.2
  epochs: 2
  minibatch_trajs: 4
  entropy_coeff: 0.01
  max_grad_norm: 1.0
  step_frac: 0.5         # re-score half of each trajectory's steps per minibatch (≈2× faster update)


rewards:
  efficiency_coeff: 1.0e-4   # per (neuron + synapse): 100 unused synapses = 0.01 accuracy

inner:
  enabled: true
  mode: control
  ticks_per_step: 4      # simulator ticks per env step, observation held on the sources
  bc_episodes: 16        # expert rollouts (DART noise) the readout is cloned from
  bc_noise: 0.2
  eval_episodes: 10      # closed-loop episodes per reward (fixed seeds)
  test_episodes: 100     # held-out episodes for the summary
  readout_neurons: outputs
  l2: 1.0e-3
  max_iter: 200

surrogate:
  enabled: false         # evaluations are cheap (~0.3 s) relative to policy sampling here
  ensemble_size: 4
  embed_dim: 32
  num_layers: 2
  lr: 1.0e-3
  warmup: 64
  sim_per_batch: 4
  ucb_kappa: 1.0
  refit_every: 16
  refit_steps: 50
