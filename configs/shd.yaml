# Latent-reservoir search on SHD (Spiking Heidelberg Digits, 20 classes): the same
# input → latent recurrent graph → output neurons setup as configs/latent.yaml,
# but on a task where the class is carried by timing.
#
# The readout sees ONLY the output neurons (sinks), which have no input of
# their own, so every bit of information it gets has flowed through the graph
# the policy built. NEW creates either an input neuron (with a receptive field
# on the patch grid) or a latent neuron (rf radius -1: no field, driven only by
# CONNECT synapses). CONNECT wires hidden → hidden (recurrent) or hidden → output.
# A small cost per neuron + synapse makes recurrence earn its place.
#
# Ablations (scripts/compare.py launch ... --suffix X --set ...):
#   dag : env.allow_cycles=false      (depth allowed, no recurrence)
#   ff  : env.hidden_to_hidden=false  (input neurons → outputs only, one layer)
algo: grpo             # grpo | random
seed: 0
threads: 1
run_name: null

env:
  input_layout: line1d   # sources are frequency channels on a line
  num_source: 140        # 700 cochlea channels pooled in groups of simulator.channel_pool = 5
  num_sink: 20           # output neurons: the only neurons the readout sees (independent of the 10 classes)
  max_hidden: 50
  max_edges: 300
  min_edges: 0           # synapse budget is a cap; stopping early is allowed
  allow_cycles: true     # recurrent reservoir
  rf_radii: [-1, 0, 2, 5]   # -1 = latent neuron (no field); else windows of 1, 5 or 11 adjacent channels
  weight_levels: [0.25, 0.5, 1.0, 2.0]   # fixed magnitudes the policy picks from (± each)
  hidden_presets:
    - {threshold: 0.5, leak: .inf}   # coincidence detector
    - {threshold: 1.0, leak: 0.0}    # integrator
    - {threshold: 1.0, leak: 0.25}
    - {threshold: 2.0, leak: 0.5}
    - {threshold: 3.0, leak: 0.1}    # slow integrator
  source_threshold: 0.5
  source_leak: .inf
  sink_threshold: 1.0
  sink_leak: 0.0

model:
  embed_dim: 64
  num_layers: 3
  mlp_hidden: 128

train:
  group_size: 16
  max_iters: 200
  sim_budget: 3200       # topology evaluations
  log_interval: 5
  checkpoint_interval: 50
  out_dir: experiments

grpo:
  lr: 3.0e-4
  clip_eps: 0.2
  epochs: 2
  minibatch_trajs: 4
  entropy_coeff: 0.01
  max_grad_norm: 1.0
  step_frac: 0.5         # re-score half of each trajectory's steps per minibatch (≈2× faster update)


rewards:
  efficiency_coeff: 1.0e-4   # per (neuron + synapse): 100 unused synapses = 0.01 accuracy

inner:
  enabled: true
  mode: reservoir
  windows: 5             # readout features: spike counts per neuron in 5 time windows
  readout: logistic      # logistic (L-BFGS) | ridge (closed form; λ-sensitive, barely faster here)
  readout_neurons: outputs   # the readout sees only the output neurons
  ridge_lambda: 10.0     # on standardised features
  l2: 1.0e-3             # logistic only
  max_iter: 200          # logistic only
  extra_ticks: 10        # ticks simulated after the last input bin (recurrent graphs need a fixed value)
  train_per_class: 100   # readout training subset (Train split)

surrogate:
  enabled: false         # evaluations are cheap (~0.3 s) relative to policy sampling here
  ensemble_size: 4
  embed_dim: 32
  num_layers: 2
  lr: 1.0e-3
  warmup: 64
  sim_per_batch: 4
  ucb_kappa: 1.0
  refit_every: 16
  refit_steps: 50

simulator:
  dataset: shd
  shd_root: data/SHD
  num_bins: 100          # 10 ms bins → 1.0 s (95% of utterances are shorter)
  bin_ms: 10.0
  channel_pool: 5
  data_seed: 0
  reward_split: train
  val_per_class: 50
  test_split: test       # includes 2 speakers absent from train
  test_per_class: 100
